<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Login - VODlibrary</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>Enter Access Key</h1>
        <form action="login" method="POST">
            <label for="sessionKey">Session Key:</label>
            <input type="password" id="sessionKey" name="sessionKey" required>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" class="error-message">
            Invalid session key. Please try again.
        </div>
    </div>

    <script>
        // Check for error query parameter and display message
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const errorMessageDiv = document.getElementById('errorMessage');
            if (errorMessageDiv) {
                errorMessageDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
